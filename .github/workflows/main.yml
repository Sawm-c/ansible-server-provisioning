name: Provision Infrastructure and Setup Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  provision:
    name: Terraform Provision & Ansible Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_key_name: "github-actions-key"
          TF_VAR_public_key: "${{ secrets.EC2_SSH_PUBLIC_KEY }}"

      - name: Get EC2 Public IP
        working-directory: ./terraform
        id: get-ip
        run: |
          EC2_IP=$(terraform output -raw server_ip)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: Setup SSH Key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Ansible Playbook
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # Wait for EC2 to be fully ready to accept SSH
          sleep 30
          # Create dynamic inventory on the fly
          echo "$EC2_IP ansible_user=ubuntu" > inventory.ini
          # Run the playbook
          ansible-playbook -i inventory.ini playbook.yml
